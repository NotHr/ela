[package]
name = "ela-local"
version = "0.1.0"
edition = "2024"
default-run = "ela-local"
description = "Local-first Telugu and English classroom assessment"
license = "AGPL-3.0-or-later"

[[bin]]
name = "ela-language-id"
path = "src/bin/ela-language-id.rs"
required-features = ["native-asr"]

[[bin]]
name = "ela-grammar"
path = "src/bin/ela-grammar.rs"
required-features = ["native-grammar"]

[features]
default = ["native-asr", "native-grammar"]
native-asr = ["dep:sherpa-onnx", "dep:whisper-rs"]
native-grammar = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tempfile = "3"
hound = "3.5"
libc = "0.2"
unicode-segmentation = "1"
unicode-normalization = "0.1"
sha2 = "0.10"
time = { version = "0.3", features = ["parsing", "formatting"] }
roxmltree = "0.21"
zip = { version = "4", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
sherpa-onnx = { version = "=2.0.1", optional = true }
whisper-rs = { version = "0.16", optional = true }
candle-core = { version = "=0.9.2", optional = true }
candle-nn = { version = "=0.9.2", optional = true }
candle-transformers = { version = "=0.9.2", optional = true }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"], optional = true }

# Native T5 tensor loops must remain optimized even in the development server.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
